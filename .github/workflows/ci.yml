name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOFLAGS: -mod=readonly
  GOPROXY: https://proxy.golang.org
  GOSUMDB: sum.golang.org
  GOVCS: '*:off'
  GOTOOLCHAIN: local

jobs:
  verify:
    name: Test, vet, and build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        # actions/setup-go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          check-latest: false
          cache: true

      - name: Check installer syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n install-cn.sh

      - name: Validate installer on the native Ubuntu architecture
        shell: bash
        run: sudo bash install.sh --check-platform

      - name: Validate installer on Debian 13 amd64
        if: matrix.arch == 'amd64'
        shell: bash
        run: docker run --rm -v "$PWD:/src:ro" debian:13 bash /src/install.sh --check-platform

      - name: Download and verify Go modules
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          go mod verify

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          packages_file="$RUNNER_TEMP/ci-packages"
          go list ./... | grep -v '/scratch$' > "$packages_file"
          mapfile -t packages < "$packages_file"
          test "${#packages[@]}" -gt 0
          go test -trimpath "${packages[@]}"

      - name: Vet
        shell: bash
        run: |
          set -euo pipefail
          packages_file="$RUNNER_TEMP/ci-packages"
          go list ./... | grep -v '/scratch$' > "$packages_file"
          mapfile -t packages < "$packages_file"
          test "${#packages[@]}" -gt 0
          go vet "${packages[@]}"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -trimpath -buildvcs=true -o "$RUNNER_TEMP/yub-wpanel-${{ matrix.arch }}" ./
