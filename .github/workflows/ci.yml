name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: |
          packages=$(go list ./... | grep -v '/scratch$')
          go test $packages

      - name: Vet
        run: |
          packages=$(go list ./... | grep -v '/scratch$')
          go vet $packages
